name: ShadowEarthquake 15-Minute Scanner

on:
  # PRIMARY trigger: an external cron (VPS crontab or cron-job.org) calls the
  # GitHub API every 15 minutes. GitHub's own scheduler is best-effort and
  # routinely delays or drops high-frequency schedules, so it cannot be the
  # only trigger for a 15-minute cadence.
  repository_dispatch:
    types: [scan]
  # FALLBACK trigger: off the top of the hour to dodge GitHub's peak-load drops.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# Nothing may write unless a job asks for it below (same pattern as REDEYE).
permissions:
  contents: read

# Never run two scans at once (avoids push races). If triggers pile up,
# GitHub keeps only the newest pending run, which is what we want.
concurrency:
  group: earthquake-scanner
  cancel-in-progress: false

jobs:
  scan-and-build:
    name: Scan Guatemala, commit state, build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write # push the updated state JSON
    env:
      TZ: America/Guatemala
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run 15-minute Guatemala seismic scan
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || 'off' }}
          SCANNER_API_KEY: ${{ secrets.SCANNER_API_KEY }}
        run: node scanner/check-guatemala-quakes.mjs

      - name: Commit & push updated seismic state
        run: |
          SCAN_TIME=$(date +"%Y-%m-%d %H:%M:%S CST")
          git config user.name "ShadowEarthquake-Bot"
          git config user.email "bot@shadowearthquake.local"
          git add frontend/public/assets/data/guatemala-seismic-state.json
          if git diff --cached --quiet; then
            echo "State file unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "New update for the earthquake in Guatemala - ${SCAN_TIME}"

          BRANCH="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the state update after 3 attempts."
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        # Keep `npm install`: frontend/package-lock.json is out of sync with
        # package.json (missing @emnapi/* optional deps), so `npm ci` fails.
        run: npm install --no-audit --no-fund

      - name: Build Angular (production)
        working-directory: frontend
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: SPA fallback for GitHub Pages
        run: cp frontend/dist/frontend/browser/index.html frontend/dist/frontend/browser/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: scan-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
